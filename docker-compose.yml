version: '3.8'

services:
  # --------------------------------------------------------------------------
  # ⚡ FrankenPHP Web Server (Laravel Application)
  # Port Container: 8080 -> Port Host: 8095 (Aman & Tidak Bentrok di 1Panel)
  # --------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cuan_money_app
    restart: always
    ports:
      - "127.0.0.1:8095:8080"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "https://cuan.humacode.my.id"
      DB_HOST: cuan_money_db
      DB_PORT: 3306
      DB_DATABASE: money_management_v2
      DB_USERNAME: money_management_v2
      DB_PASSWORD: ${DB_PASSWORD:-HumaCode2026}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-AQ.Ab8RN6KTlz4Ug70eqqHKvZz6nTqvpCrhq6BEjv9tRLoyjp_Kww}
      RECAPTCHA_SITE_KEY: ${RECAPTCHA_SITE_KEY:-6Lfu-W8tAAAAAHD4ouVvYQU6UPKOTrxjKJfzbXnN}
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY:-6Lfu-W8tAAAAAJ4Ku7Qm0aIQkfuZZilcTxTygoLT}
      VITE_RECAPTCHA_SITE_KEY: ${RECAPTCHA_SITE_KEY:-6Lfu-W8tAAAAAHD4ouVvYQU6UPKOTrxjKJfzbXnN}
      SERVER_NAME: "cuan.humacode.my.id"
    volumes:
      - ./storage:/app/storage
      - ./bootstrap/cache:/app/bootstrap/cache
    depends_on:
      - db
    networks:
      - cuan_network

  # --------------------------------------------------------------------------
  # 🗄️ MySQL Database
  # Port Container: 3306 -> Port Host: 3309 (Aman dari 3306, 3307, 3308 di 1Panel)
  # --------------------------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: cuan_money_db
    restart: always
    ports:
      - "127.0.0.1:3309:3306"
    environment:
      MYSQL_DATABASE: money_management_v2
      MYSQL_USER: money_management_v2
      MYSQL_PASSWORD: ${DB_PASSWORD:-HumaCode2026}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-HumaCode2026}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - cuan_network

networks:
  cuan_network:
    driver: bridge

volumes:
  db_data:
    driver: local
