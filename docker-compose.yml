services:
  # --------------------------------------------------------------------------
  # ⚡ FrankenPHP Web Server (Laravel Application)
  # Port Container: 8080 -> Port Host: 8095 (Aman & Tidak Bentrok di 1Panel)
  # --------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cuan_money_app
    restart: always
    ports:
      - "8096:8080"
    environment:
      APP_ENV: production
      APP_DEBUG: "true"
      APP_URL: "https://cuan.humacode.my.id"
      ASSET_URL: "https://cuan.humacode.my.id"
      DB_HOST: cuan_money_db
      DB_PORT: 3306
      DB_DATABASE: money_management_v2
      DB_USERNAME: money_management_v2
      DB_PASSWORD: ${DB_PASSWORD:-HumaCode2026}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-AQ.Ab8RN6KTlz4Ug70eqqHKvZz6nTqvpCrhq6BEjv9tRLoyjp_Kww}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      RECAPTCHA_SITE_KEY: ${RECAPTCHA_SITE_KEY:-6Lfu-W8tAAAAAHD4ouVvYQU6UPKOTrxjKJfzbXnN}
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY:-6Lfu-W8tAAAAAJ4Ku7Qm0aIQkfuZZilcTxTygoLT}
      VITE_RECAPTCHA_SITE_KEY: ${RECAPTCHA_SITE_KEY:-6Lfu-W8tAAAAAHD4ouVvYQU6UPKOTrxjKJfzbXnN}
      WA_GATEWAY_URL: ${WA_GATEWAY_URL:-https://wa.humacode.my.id/api/v1/whatsapp/messages}
      WA_GATEWAY_KEY: ${WA_GATEWAY_KEY}
      SERVER_NAME: "cuan.humacode.my.id"
    volumes:
      - ./storage:/app/storage
      - ./bootstrap/cache:/app/bootstrap/cache
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cuan_network

  # --------------------------------------------------------------------------
  # ⏰ Laravel Scheduler Service (Auto Rollover & Scheduled Tasks)
  # --------------------------------------------------------------------------
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cuan_money_scheduler
    restart: always
    command: php artisan schedule:work
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_HOST: cuan_money_db
      DB_PORT: 3306
      DB_DATABASE: money_management_v2
      DB_USERNAME: money_management_v2
      DB_PASSWORD: ${DB_PASSWORD:-HumaCode2026}
      WA_GATEWAY_URL: ${WA_GATEWAY_URL:-https://wa.humacode.my.id/api/v1/whatsapp/messages}
      WA_GATEWAY_KEY: ${WA_GATEWAY_KEY}
    volumes:
      - ./storage:/app/storage
      - ./bootstrap/cache:/app/bootstrap/cache
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
    networks:
      - cuan_network

  # --------------------------------------------------------------------------
  # 🗄️ MySQL Database
  # Port Container: 3306 -> Port Host: 3311 (Aman dari 3306, 3310, dll di Host)
  # --------------------------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: cuan_money_db
    restart: always
    ports:
      - "127.0.0.1:3311:3306"
    environment:
      MYSQL_DATABASE: money_management_v2
      MYSQL_USER: money_management_v2
      MYSQL_PASSWORD: ${DB_PASSWORD:-HumaCode2026}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-HumaCode2026}
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pHumaCode2026" ]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - cuan_network

networks:
  cuan_network:
    driver: bridge

volumes:
  db_data:
    driver: local
